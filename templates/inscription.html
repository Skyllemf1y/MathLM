{% extends "base.html" %}
{% block contenu %}
    <a href="{{ url_for('accueil') }}" class="bouton-retour">← Retour</a>

    <section class="section-intro">
        <h1>Créer un compte</h1>
        <p class="sous-titre">Choisis un pseudo et un mot de passe.</p>
    </section>

    <form method="POST" class="carte-profil">
        <label class="etiquette-champ" for="champ-pseudo">Pseudo</label>
        <input type="text" id="champ-pseudo" name="pseudo" maxlength="20" required
               placeholder="3 à 20 caractères (lettres, chiffres, - et _)">

        <label class="etiquette-champ" for="champ-mdp">Mot de passe</label>
        <input type="password" id="champ-mdp" name="mot_de_passe" required
               placeholder="Au moins 4 caractères">

        <label class="etiquette-champ" for="champ-confirmation">Confirme le mot de passe</label>
        <input type="password" id="champ-confirmation" name="confirmation" required>

        <button type="submit" class="bouton-continuer">Créer mon compte</button>
    </form>

    <p class="sous-titre" style="margin-top:16px;">
        Déjà un compte ? <a href="{{ url_for('connexion') }}">Connecte-toi</a>
    </p>
{% endblock %}
